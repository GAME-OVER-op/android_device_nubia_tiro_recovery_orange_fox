name: Build flashable recovery.img

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: OrangeFox build type
        required: true
        default: Unofficial
        type: choice
        options:
          - Unofficial
          - Beta
          - Stable
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OrangeFox 14.1 / tiro
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_SRC: ${{ github.workspace }}/fox_14.1
      OUT_DIR: ${{ github.workspace }}/out
      FOX_BUILD_DEVICE: tiro
      ALLOW_MISSING_DEPENDENCIES: 'true'
      LC_ALL: C
      BUILD_JOBS: '2'
      FOX_SYNC_REV: 14eca5f7
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout recovery project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/microsoft || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libc6-dev-i386 libelf-dev libgl1-mesa-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 \
            openjdk-17-jdk pngcrush python3 python3-pip python-is-python3 repo rsync \
            schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Validate bundled device tree and haptics patch
        run: |
          set -euxo pipefail
          python3 scripts/validate_tree.py
          python3 scripts/test_haptics_patch.py
          g++ -std=c++17 -Wall -Wextra -Werror scripts/haptics_ff_smoketest.cpp -o /tmp/haptics_ff_smoketest
          /tmp/haptics_ff_smoketest

      - name: Sync OrangeFox 14.1 minimal source
        shell: bash
        run: |
          set -euxo pipefail
          export FOX_SYNC_DIR="$GITHUB_WORKSPACE/orangefox-sync"
          scripts/sync_fox.sh
          df -h

      - name: Install tiro tree and patch haptics
        shell: bash
        run: |
          set -euxo pipefail
          export TIRO_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          scripts/prepare_source.sh
          grep -n "TIRO_INPUT_FF_HAPTICS" "$FOX_SRC/bootable/recovery/minuitwrp/events.cpp"
          grep -n "TIRO_GUI_BUTTON_DIAGNOSTICS" "$FOX_SRC/bootable/recovery/gui/button.cpp"
          python3 "$GITHUB_WORKSPACE/scripts/patch_theme_button_resources.py" --check "$FOX_SRC"
          python3 "$GITHUB_WORKSPACE/scripts/patch_dalvik_language_resources.py" --check "$FOX_SRC"
          if grep -q 'AServiceManager_getService(kVibratorInstance.c_str())' "$FOX_SRC/bootable/recovery/minuitwrp/events.cpp"; then
            echo "Blocking vibrator service lookup survived patch" >&2
            exit 1
          fi

      - name: Configure build swap
        shell: bash
        run: |
          set -euxo pipefail
          scripts/setup_ci_swap.sh 16 18

      - name: Build recovery image
        shell: bash
        run: |
          set -euxo pipefail
          export FOX_BUILD_TYPE="${{ inputs.build_type || 'Unofficial' }}"
          export TIRO_BUILD_VERSION="${GITHUB_RUN_NUMBER}"
          export FOX_BUILD_DEVICE=tiro
          export ALLOW_MISSING_DEPENDENCIES=true
          # Hosted runners are ephemeral; ccache only consumes scarce disk here.
          export USE_CCACHE=0
          cd "$FOX_SRC"

          # AOSP/OrangeFox envsetup is designed to be sourced by an interactive
          # shell. It is neither nounset-safe nor guaranteed to return zero: the
          # last optional probe in the script may legitimately be a false `[ -s ]`
          # test. Disable -u for the Android shell environment and temporarily
          # disable -e only while sourcing envsetup. Re-enable -e immediately,
          # then validate the functions/top directory before doing any build work.
          set +u
          set +e
          source build/envsetup.sh
          ENVSETUP_RC=$?
          set -e

          if ! declare -F lunch >/dev/null; then
            echo "ERROR: envsetup did not define lunch (rc=$ENVSETUP_RC)" >&2
            exit 1
          fi
          if ! declare -F mka >/dev/null; then
            echo "ERROR: envsetup did not define mka (rc=$ENVSETUP_RC)" >&2
            exit 1
          fi

          RESOLVED_TOP="$(gettop 2>/dev/null || true)"
          if [[ "$RESOLVED_TOP" != "$FOX_SRC" ]]; then
            echo "ERROR: envsetup resolved Android top incorrectly" >&2
            echo "  expected: $FOX_SRC" >&2
            echo "  resolved: $RESOLVED_TOP" >&2
            exit 1
          fi

          if (( ENVSETUP_RC != 0 )); then
            echo "::warning::build/envsetup.sh returned $ENVSETUP_RC after completing setup; continuing because lunch/mka/gettop validation passed."
          fi

          lunch twrp_tiro-ap2a-eng

          PLATFORM_SDK="$(get_build_var PLATFORM_SDK_VERSION)"
          PRODUCT_API="$(get_build_var PRODUCT_SHIPPING_API_LEVEL)"
          if [[ "$PLATFORM_SDK" != "34" || "$PRODUCT_API" != "34" ]]; then
            echo "ERROR: wrong OrangeFox runtime profile: platform_sdk=$PLATFORM_SDK product_api=$PRODUCT_API; expected 34/34" >&2
            exit 1
          fi
          # Soong can spend a long time generating the dependency graph with
          # no console output. Keep a lightweight heartbeat alive so CI logs show
          # CPU/RAM/swap/disk pressure and whether Soong/Ninja are still running.
          # Run the heartbeat in its own session/process group so every child
          # (including a pending sleep) can be stopped deterministically.
          setsid "$GITHUB_WORKSPACE/scripts/build_heartbeat.sh" 60 &
          HEARTBEAT_PID=$!
          cleanup_build_monitor() {
            kill -TERM -- "-$HEARTBEAT_PID" 2>/dev/null || true
            # Never let monitor cleanup keep the Actions step alive.
            for _ in 1 2 3 4 5; do
              kill -0 "$HEARTBEAT_PID" 2>/dev/null || break
              sleep 1
            done
            kill -KILL -- "-$HEARTBEAT_PID" 2>/dev/null || true
            wait "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup_build_monitor EXIT INT TERM

          mka -j"${BUILD_JOBS}" adbd recoveryimage

          cleanup_build_monitor
          trap - EXIT INT TERM

          # IMPORTANT: Do not swapoff a large CI swapfile here. On a memory-
          # constrained hosted runner, swapoff must fault every swapped page back
          # into RAM and can thrash for a very long time after a successful build.
          # The runner is ephemeral, so leaving /swapfile active until runner
          # teardown is both safe and faster.
          echo "Build finished; leaving CI swap enabled until runner teardown."
          swapon --show || true

      - name: Verify and stage artifacts
        shell: bash
        run: |
          set -euxo pipefail
          PRODUCT_OUT="$OUT_DIR/target/product/tiro"
          IMG="$PRODUCT_OUT/recovery.img"
          test -f "$IMG"
          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$IMG" "$GITHUB_WORKSPACE/dist/recovery.img"
          "$GITHUB_WORKSPACE/scripts/verify_recovery.sh" \
            "$GITHUB_WORKSPACE/dist/recovery.img" "$PRODUCT_OUT"
          sha256sum "$GITHUB_WORKSPACE/dist/recovery.img" > "$GITHUB_WORKSPACE/dist/recovery.img.sha256"
          "$GITHUB_WORKSPACE/scripts/make_build_info.sh" \
            "$GITHUB_WORKSPACE/dist/recovery.img" \
            "$GITHUB_WORKSPACE/dist/build-info.txt" \
            "$FOX_SRC"
          cp "$PRODUCT_OUT/recovery/root/tmp/recovery.log" "$GITHUB_WORKSPACE/dist/build-recovery.log" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload flashable image
        uses: actions/upload-artifact@v6
        with:
          name: RedMagic9Pro-tiro-recovery-${{ github.sha }}
          path: |
            dist/recovery.img
            dist/recovery.img.sha256
            dist/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
